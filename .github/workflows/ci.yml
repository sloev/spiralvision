name: Build & Release

# Runs ONLY when you ask: push a tag like v0.2.0, or click "Run workflow".
# Day-to-day checks run locally with ./scripts/check.sh (saves Actions minutes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # x86_64 native + Raspberry Pi aarch64 cross-compiled (same steps as local).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (+ arm64 ALSA for the Pi build)
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports/\nSuites: noble noble-updates\nComponents: main universe\nArchitectures: arm64\n' | sudo tee /etc/apt/sources.list.d/arm64-ports.sources
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libfontconfig1-dev \
            gcc-aarch64-linux-gnu libasound2-dev:arm64 python3-pil
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-unknown-linux-gnu
          components: rustfmt
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checks (fmt, tests, wasm, smoke, bench)
        run: ./scripts/check.sh
      - name: Package x86_64
        run: ./scripts/package-linux.sh x86_64
      - name: Build + package Raspberry Pi (aarch64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu -p spiralvision -p spiralvision-cli
          ./scripts/package-linux.sh aarch64 target/aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p spiralvision -p spiralvision-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/spiralvision-windows-x86_64 -Force | Out-Null
          Copy-Item target/release/spiralvision.exe, target/release/spiralvision-cli.exe, README.md dist/spiralvision-windows-x86_64/
          Compress-Archive -Path dist/spiralvision-windows-x86_64 -DestinationPath dist/spiralvision-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/spiralvision-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - name: Build universal binaries
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p spiralvision -p spiralvision-cli
          done
      - name: Bundle .app
        run: ./scripts/package-macos.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/SpiralVision-macos-universal.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM into docs/
        run: ./scripts/build-wasm.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: VERSION_NAME="${GITHUB_REF_NAME#v}" ./scripts/package-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/SpiralVision-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SpiralVision ${{ github.ref_name }}
          body_path: .github/release-notes.md
          make_latest: true
          files: dist/*
