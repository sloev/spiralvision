name: Build & Release

# Runs ONLY when you ask: push a tag like v0.2.0, or click "Run workflow"
# (fill in "release" with a new tag like v0.2.1 to build AND publish a release;
# the tag is created on the commit that was built).
# Day-to-day checks run locally with ./scripts/check.sh (saves Actions minutes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Tag to create + publish, e.g. v0.2.1 (empty = build only)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.release || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # x86_64 native + Raspberry Pi aarch64 cross-compiled (same steps as local).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (+ arm64 ALSA for the Pi build)
        run: |
          sudo ./scripts/apt-arm64.sh
          sudo apt-get update
          sudo apt-get install -y ffmpeg libasound2-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libfontconfig1-dev \
            gcc-aarch64-linux-gnu libasound2-dev:arm64 python3-pil
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-unknown-linux-gnu
          components: rustfmt
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checks (fmt, tests, wasm, smoke, bench)
        run: ./scripts/check.sh
      - name: Package x86_64
        run: ./scripts/package-linux.sh x86_64
      - name: Build + package Raspberry Pi (aarch64, cross-compiled)
        run: ./scripts/package-linux.sh aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p spiralvision -p spiralvision-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/spiralvision-windows-x86_64 -Force | Out-Null
          Copy-Item target/release/spiralvision.exe, target/release/spiralvision-cli.exe, README.md dist/spiralvision-windows-x86_64/
          Compress-Archive -Path dist/spiralvision-windows-x86_64 -DestinationPath dist/spiralvision-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/spiralvision-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - name: Build universal binaries
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p spiralvision -p spiralvision-cli
          done
      - name: Bundle .app
        run: ./scripts/package-macos.sh "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/SpiralVision-macos-universal.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM into docs/
        run: ./scripts/build-wasm.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: VERSION_NAME="${RELEASE_TAG#v}" ./scripts/package-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/SpiralVision-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: SpiralVision ${{ env.RELEASE_TAG }}
          body_path: .github/release-notes.md
          make_latest: true
          files: dist/*
