[package]
name = "spiralvision"
version = "0.2.0"
edition = "2021"

[dependencies]
spiralvision-core = { path = "crates/spiralvision-core", features = ["io"] }
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
crossbeam-channel = "0.5"
parking_lot = "0.12"
rfd = "0.15"

[workspace]
members = [".", "crates/spiralvision-core", "crates/spiralvision-cli", "crates/spiralvision-wasm"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"

[profile.release.package.spiralvision-core]
opt-level = 3
